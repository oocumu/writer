<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글월 — 문서 편집기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Nanum+Myeongjo:wght@400;700&family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --ink:#191919; --ink-soft:#3d3d3d; --paper:#ffffff; --bg:#f2f2f2; --canvas:#e8e8e8; --surface:#ffffff;
  --line:#e4e4e4; --line-strong:#d2d2d2; --accent:#3182f6; --accent-hover:#1c6fe0; --accent-soft:#eaf2fe;
  --muted:#8a8a8a; --radius:10px; --radius-sm:7px;
  --font-ui:'Pretendard','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-ui);-webkit-font-smoothing:antialiased}
button,select,input{font-family:inherit}
#app{display:flex;flex-direction:column;height:100vh;}

/* ---- top bar ---- */
#titlebar{background:var(--surface);color:var(--ink);padding:13px 22px;display:flex;align-items:center;gap:14px;flex-shrink:0;border-bottom:1px solid var(--line)}
#titlebar h1{font-size:15px;font-weight:700;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
#titlebar h1::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
#docTitleInput{background:transparent;border:none;color:var(--ink-soft);font-size:14px;padding:5px 8px;width:220px;border-radius:var(--radius-sm)}
#docTitleInput::placeholder{color:var(--muted)}
#docTitleInput:hover,#docTitleInput:focus{background:var(--bg);outline:none}
.spacer{flex:1}
.tb-btn{background:transparent;border:none;color:var(--ink-soft);padding:8px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;transition:background .12s}
.tb-btn:hover{background:var(--bg)}
.tb-btn.primary{background:var(--accent);color:#fff;font-weight:600}
.tb-btn.primary:hover{background:var(--accent-hover)}
.save-status{font-size:11.5px;color:var(--muted);white-space:nowrap}

/* ---- toolbar ---- */
#toolbar{background:var(--surface);border-bottom:1px solid var(--line);padding:9px 22px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;flex-shrink:0}
.grp{display:flex;align-items:center;gap:4px;padding:0 10px;border-right:1px solid var(--line)}
.grp:last-child{border-right:none}
.grp label{font-size:11.5px;color:var(--muted);white-space:nowrap;margin-right:2px}
.grp select,.grp input[type=number]{border:1px solid var(--line);border-radius:var(--radius-sm);padding:5px 7px;font-size:12.5px;background:var(--bg);color:var(--ink-soft)}
.grp select:hover,.grp input[type=number]:hover{border-color:var(--line-strong)}
.ibtn{width:30px;height:30px;border:none;background:transparent;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:background .12s}
.ibtn:hover{background:var(--bg)}
.ibtn.active{background:var(--accent-soft);color:var(--accent)}
.ibtn svg{width:15px;height:15px}
input[type=range]{width:70px;accent-color:var(--accent)}
.rangeval{font-size:11px;color:var(--muted);width:34px}
input[type=color]{width:28px;height:28px;border:1px solid var(--line);border-radius:50%;padding:0;cursor:pointer;overflow:hidden}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}

/* ---- workspace ---- */
 #workspace{flex:1;overflow:auto;padding:36px 20px;background:var(--canvas)}
#page{display:flex;flex-direction:column;align-items:center;gap:24px;outline:none;width:max-content;margin:0 auto}
.sheet{width:var(--pw);height:var(--ph);padding:var(--pt) var(--pr) var(--pb) var(--pl);background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08),0 6px 20px rgba(0,0,0,.08);position:relative;overflow:hidden;flex-shrink:0;box-sizing:border-box;font-family:'Noto Serif KR',serif;font-size:12pt;line-height:1.6;color:#191919}
.sheet.grow{height:auto;min-height:var(--ph);overflow:visible}
.sheet::before{content:attr(data-h);position:absolute;top:calc(var(--pt)/2 - 8px);left:0;right:0;text-align:center;font:11px var(--font-ui);color:#999;pointer-events:none}
.sheet::after{content:attr(data-n);position:absolute;bottom:calc(var(--pb)/2 - 8px);left:var(--pl);right:var(--pr);text-align:var(--pna,center);font:11px var(--font-ui);color:#999;pointer-events:none}
.sheet h1.chapter{font-size:1.55em;font-weight:700;margin:0 0 .6em;padding-bottom:.4em;border-bottom:1px solid var(--line-strong)}
.sheet p{margin:0 0 1em}

/* ---- settings modal ---- */
.overlay{position:fixed;inset:0;background:rgba(25,25,25,.38);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;backdrop-filter:blur(2px)}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:26px 28px;box-shadow:0 20px 60px rgba(20,20,18,.18)}
.modal h2{margin:0 0 4px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.modal .sub{color:var(--muted);font-size:12.5px;margin:0 0 18px;line-height:1.5}
.fieldrow{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.field{flex:1;min-width:120px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
.field input,.field select{width:100%;border:1px solid transparent;background:var(--bg);border-radius:var(--radius-sm);padding:9px 10px;font-size:13px;color:var(--ink);transition:border-color .12s}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);background:#fff}
.section-title{font-size:13px;font-weight:700;color:var(--ink);margin:20px 0 10px;padding-top:16px;border-top:1px solid var(--line)}
.section-title:first-of-type{margin-top:0;padding-top:0;border-top:none}
.checkline{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:10px;color:var(--ink-soft)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.btn{padding:9px 16px;border-radius:var(--radius-sm);border:none;background:var(--bg);color:var(--ink-soft);cursor:pointer;font-size:13px;font-weight:500;transition:background .12s}
.btn:hover{background:var(--line)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}

/* ---- 내보내기용 오프스크린 페이지 스타일 (PNG/PDF 캡처에 사용) ---- */
.bookpage{background:#fff;position:relative;display:flex;flex-direction:column}
#exportBusy{position:fixed;inset:0;background:rgba(25,25,25,.5);display:none;align-items:center;justify-content:center;z-index:80;color:#fff;font-size:14px}
#exportBusy.show{display:flex}
.bp-header{font-size:11px;color:#a3a3a3;text-align:center;flex-shrink:0}
.bp-body{flex:1;overflow:hidden}
.bp-footer{font-size:11px;color:#a3a3a3;text-align:center;flex-shrink:0}
.bp-cover{align-items:center;justify-content:center;text-align:center;display:flex;flex-direction:column;gap:10px}
.bp-toc li{margin-bottom:8px;display:flex;justify-content:space-between;font-size:14px;color:var(--ink-soft)}
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <h1>글월</h1>
    <input id="docTitleInput" placeholder="제목 없는 문서">
    <span id="saveStatus" class="save-status"></span>
    <div class="spacer"></div>
    <button class="tb-btn" id="btnSaveFile" title="이 컴퓨터의 다른 위치나 다른 데스크톱으로 옮길 수 있는 파일로 저장">💾 파일로 저장</button>
    <button class="tb-btn" id="btnLoadFile" title="저장해둔 .gwol 파일 불러오기">📂 불러오기</button>
    <input type="file" id="fileInput" accept=".gwol,.json" style="display:none">
    <button class="tb-btn" id="btnSettings">⚙ 페이지 설정</button>
    <button class="tb-btn" id="btnExportPNG">PNG로 저장</button>
    <button class="tb-btn" id="btnExportPDF">PDF로 내보내기</button>
    <button class="tb-btn primary" id="btnExport">⬇ HTML로 내보내기</button>
  </div>

  <div id="toolbar">
    <div class="grp">
      <select id="fontFamily">
        <option value="'Noto Serif KR',serif">본명조</option>
        <option value="'Noto Sans KR',sans-serif">맑은 고딕</option>
        <option value="'Nanum Myeongjo',serif">나눔명조</option>
        <option value="'Nanum Gothic',sans-serif">나눔고딕</option>
      </select>
      <select id="fontSize">
        <option>10</option><option>11</option><option selected>12</option><option>14</option><option>16</option><option>18</option><option>20</option><option>24</option><option>28</option>
      </select>
    </div>
    <div class="grp">
      <button class="ibtn" data-cmd="bold" style="font-weight:700">B</button>
      <button class="ibtn" data-cmd="italic" style="font-style:italic">I</button>
      <button class="ibtn" data-cmd="underline" style="text-decoration:underline">U</button>
      <input type="color" id="textColor" value="#1b1d1f" title="글자색">
    </div>
    <div class="grp">
      <button class="ibtn" data-align="Left" title="왼쪽 정렬"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="10" y2="8"/><line x1="2" y1="12" x2="12" y2="12"/></svg></button>
      <button class="ibtn" data-align="Center" title="가운데 정렬"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="2" y1="4" x2="14" y2="4"/><line x1="4" y1="8" x2="12" y2="8"/><line x1="3" y1="12" x2="13" y2="12"/></svg></button>
      <button class="ibtn" data-align="Right" title="오른쪽 정렬"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="2" y1="4" x2="14" y2="4"/><line x1="6" y1="8" x2="14" y2="8"/><line x1="4" y1="12" x2="14" y2="12"/></svg></button>
      <button class="ibtn" data-align="Full" title="양쪽 정렬"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/></svg></button>
    </div>
    <div class="grp">
      <label>장평</label>
      <input type="range" id="hscale" min="70" max="130" value="100">
      <span class="rangeval" id="hscaleVal">100%</span>
    </div>
    <div class="grp">
      <label>자간</label>
      <input type="range" id="letterSpacing" min="-3" max="10" value="0">
      <span class="rangeval" id="letterSpacingVal">0px</span>
    </div>
    <div class="grp">
      <label>줄간격</label>
      <select id="lineHeight">
        <option value="1.3">130%</option>
        <option value="1.6" selected>160%</option>
        <option value="1.8">180%</option>
        <option value="2.0">200%</option>
        <option value="2.5">250%</option>
      </select>
    </div>
    <div class="grp">
      <button class="ibtn" id="btnChapter" title="새 챕터" style="width:auto;padding:0 10px;">＋챕터</button>
    </div>
  </div>

  <div id="workspace">
    <div id="page" contenteditable="true" spellcheck="false">
      <h1 class="chapter">1장. 시작하는 글</h1>
      <p>여기에 내용을 입력하세요. 위 도구모음에서 글꼴, 크기, 장평, 자간, 줄간격을 바꿀 수 있습니다.</p>
    </div>
  </div>
</div>

<!-- 설정 모달 -->
<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <h2>페이지 설정</h2>
    <p class="sub">용지·여백·머리말/꼬리말·표지·목차를 설정합니다. 내보낼 책에 그대로 적용됩니다.</p>

    <div class="section-title">용지</div>
    <div class="fieldrow">
      <div class="field"><label>용지 크기</label>
        <select id="paperPreset">
          <option value="A4">A4 (210×297mm)</option>
          <option value="B5">B5 (176×250mm)</option>
          <option value="Letter">Letter (216×279mm)</option>
          <option value="custom">사용자 지정</option>
        </select>
      </div>
      <div class="field"><label>너비(mm)</label><input type="number" id="paperW" value="210"></div>
      <div class="field"><label>높이(mm)</label><input type="number" id="paperH" value="297"></div>
    </div>
    <div class="fieldrow">
      <div class="field"><label>위 여백(mm)</label><input type="number" id="mT" value="25"></div>
      <div class="field"><label>아래 여백(mm)</label><input type="number" id="mB" value="25"></div>
      <div class="field"><label>왼쪽 여백(mm)</label><input type="number" id="mL" value="22"></div>
      <div class="field"><label>오른쪽 여백(mm)</label><input type="number" id="mR" value="22"></div>
    </div>

    <div class="section-title">머리말 / 꼬리말 / 쪽번호</div>
    <div class="fieldrow">
      <div class="field"><label>머리말 텍스트</label><input type="text" id="headerText" placeholder="예: 나의 원고"></div>
      <div class="field"><label>꼬리말 텍스트</label><input type="text" id="footerText" placeholder="비워두면 표시 안 함"></div>
    </div>
    <label class="checkline"><input type="checkbox" id="showPageNum" checked> 쪽번호 표시</label>
    <div class="fieldrow">
      <div class="field"><label>쪽번호 위치</label>
        <select id="pageNumPos"><option value="center">하단 중앙</option><option value="right">하단 오른쪽</option></select>
      </div>
    </div>

    <div class="section-title">표지 · 목차</div>
    <div class="fieldrow">
      <div class="field"><label>책 제목</label><input type="text" id="coverTitle" placeholder="책 제목"></div>
    </div>
    <div class="fieldrow">
      <div class="field"><label>부제</label><input type="text" id="coverSubtitle" placeholder="(선택)"></div>
      <div class="field"><label>저자</label><input type="text" id="coverAuthor" placeholder="(선택)"></div>
    </div>
    <label class="checkline"><input type="checkbox" id="showToc" checked> 목차 페이지 자동 생성 (＋챕터로 넣은 제목 기준)</label>

    <div class="modal-actions">
      <button class="btn" id="settingsCancel">닫기</button>
      <button class="btn primary" id="settingsSave">적용</button>
    </div>
  </div>
</div>

<div id="exportBusy">내보내는 중…</div>

<script>
const page = document.getElementById('page');
const MM = v => v * 3.7795275591; // px @ 96dpi

let settings = JSON.parse(localStorage.getItem('geulwol_settings') || 'null') || {
  paperW:210, paperH:297, mT:25, mB:25, mL:22, mR:22,
  headerText:'', footerText:'', showPageNum:true, pageNumPos:'center',
  coverTitle:'', coverSubtitle:'', coverAuthor:'', showToc:true
};

// restore saved draft
const savedContent = localStorage.getItem('geulwol_content');
const savedTitle = localStorage.getItem('geulwol_title');
if(savedContent) page.innerHTML = savedContent;
if(savedTitle) document.getElementById('docTitleInput').value = savedTitle;

function setVars(el){
  const st=el.style;
  [['--pw',settings.paperW],['--ph',settings.paperH],['--pt',settings.mT],['--pb',settings.mB],['--pl',settings.mL],['--pr',settings.mR]].forEach(([k,v])=>st.setProperty(k,MM(v)+'px'));
  st.setProperty('--pna', settings.pageNumPos==='right'?'right':'center');
}
function applyPageBox(){ setVars(page); }
applyPageBox();

function showSaveStatus(text){
  const el = document.getElementById('saveStatus');
  const t = new Date();
  const timeStr = t.toLocaleTimeString('ko-KR', {hour:'numeric', minute:'2-digit'});
  el.textContent = `${text} · ${timeStr}`;
}
let autosaveTimer = null;
let rfId=0;
function scheduleReflow(){ cancelAnimationFrame(rfId); rfId=requestAnimationFrame(()=>{ reflow(); persist(); }); }
function autosave(){ scheduleReflow(); }
function persist(){
  localStorage.setItem('geulwol_content', page.innerHTML);
  localStorage.setItem('geulwol_title', document.getElementById('docTitleInput').value);
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(()=>showSaveStatus('이 브라우저에 자동 저장됨'), 400);
}
page.addEventListener('input', autosave);
document.getElementById('docTitleInput').addEventListener('input', autosave);
if(savedContent || savedTitle) showSaveStatus('이전 작업 불러옴');

// ---- toolbar: bold/italic/underline/align ----
document.querySelectorAll('[data-cmd]').forEach(b=>{
  b.addEventListener('mousedown', e=>e.preventDefault());
  b.addEventListener('click', ()=>{ page.focus(); document.execCommand(b.dataset.cmd,false,null); });
});
document.querySelectorAll('[data-align]').forEach(b=>{
  b.addEventListener('mousedown', e=>e.preventDefault());
  b.addEventListener('click', ()=>{ page.focus(); document.execCommand('justify'+b.dataset.align,false,null); });
});

// generic: wrap current selection in a styled span
function wrapSelectionStyle(styleFn){
  const sel = window.getSelection();
  if(!sel.rangeCount || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  const span = document.createElement('span');
  styleFn(span.style);
  try{
    range.surroundContents(span);
  }catch(e){
    const frag = range.extractContents();
    span.appendChild(frag);
    range.insertNode(span);
  }
  sel.removeAllRanges();
  const r2 = document.createRange(); r2.selectNodeContents(span);
  sel.addRange(r2);
  autosave();
}
document.getElementById('fontFamily').addEventListener('change', e=>{
  page.focus(); wrapSelectionStyle(s=>s.fontFamily=e.target.value);
});
document.getElementById('fontSize').addEventListener('change', e=>{
  page.focus(); wrapSelectionStyle(s=>s.fontSize=e.target.value+'pt');
});
document.getElementById('textColor').addEventListener('input', e=>{
  page.focus(); wrapSelectionStyle(s=>s.color=e.target.value);
});
const hscale = document.getElementById('hscale'), hscaleVal = document.getElementById('hscaleVal');
hscale.addEventListener('input', ()=>hscaleVal.textContent = hscale.value+'%');
hscale.addEventListener('change', ()=>{
  page.focus();
  wrapSelectionStyle(s=>{ s.display='inline-block'; s.transform=`scaleX(${hscale.value/100})`; s.transformOrigin='left'; });
});
const ls = document.getElementById('letterSpacing'), lsVal = document.getElementById('letterSpacingVal');
ls.addEventListener('input', ()=>lsVal.textContent = ls.value+'px');
ls.addEventListener('change', ()=>{
  page.focus(); wrapSelectionStyle(s=>s.letterSpacing = ls.value+'px');
});
document.getElementById('lineHeight').addEventListener('change', e=>{
  page.focus();
  const sel = window.getSelection();
  if(!sel.rangeCount) return;
  let node = sel.getRangeAt(0).startContainer;
  if(node.nodeType===3) node = node.parentElement;
  const block = node.closest('p,h1,h2,li,blockquote') || page;
  block.style.lineHeight = e.target.value;
  autosave();
});
document.getElementById('btnChapter').addEventListener('click', ()=>{
  const h = document.createElement('h1'); h.className='chapter'; h.textContent='새 챕터 제목';
  const p = document.createElement('p'); p.textContent='내용을 입력하세요.';
  const last = page.lastElementChild || page; last.appendChild(h); last.appendChild(p);
  autosave();
});

// ---- settings modal ----
const settingsOverlay = document.getElementById('settingsOverlay');
function loadSettingsToForm(){
  document.getElementById('paperW').value=settings.paperW;
  document.getElementById('paperH').value=settings.paperH;
  document.getElementById('mT').value=settings.mT;
  document.getElementById('mB').value=settings.mB;
  document.getElementById('mL').value=settings.mL;
  document.getElementById('mR').value=settings.mR;
  document.getElementById('headerText').value=settings.headerText;
  document.getElementById('footerText').value=settings.footerText;
  document.getElementById('showPageNum').checked=settings.showPageNum;
  document.getElementById('pageNumPos').value=settings.pageNumPos;
  document.getElementById('coverTitle').value=settings.coverTitle;
  document.getElementById('coverSubtitle').value=settings.coverSubtitle;
  document.getElementById('coverAuthor').value=settings.coverAuthor;
  document.getElementById('showToc').checked=settings.showToc;
}
document.getElementById('btnSettings').addEventListener('click', ()=>{ loadSettingsToForm(); settingsOverlay.classList.add('show'); });
document.getElementById('settingsCancel').addEventListener('click', ()=>settingsOverlay.classList.remove('show'));
document.getElementById('paperPreset').addEventListener('change', e=>{
  const presets = {A4:[210,297], B5:[176,250], Letter:[216,279]};
  if(presets[e.target.value]){
    document.getElementById('paperW').value = presets[e.target.value][0];
    document.getElementById('paperH').value = presets[e.target.value][1];
  }
});
document.getElementById('settingsSave').addEventListener('click', ()=>{
  settings = {
    paperW:+document.getElementById('paperW').value, paperH:+document.getElementById('paperH').value,
    mT:+document.getElementById('mT').value, mB:+document.getElementById('mB').value,
    mL:+document.getElementById('mL').value, mR:+document.getElementById('mR').value,
    headerText:document.getElementById('headerText').value, footerText:document.getElementById('footerText').value,
    showPageNum:document.getElementById('showPageNum').checked, pageNumPos:document.getElementById('pageNumPos').value,
    coverTitle:document.getElementById('coverTitle').value, coverSubtitle:document.getElementById('coverSubtitle').value,
    coverAuthor:document.getElementById('coverAuthor').value, showToc:document.getElementById('showToc').checked
  };
  localStorage.setItem('geulwol_settings', JSON.stringify(settings));
  applyPageBox(); scheduleReflow();
  settingsOverlay.classList.remove('show');
});

// ---- 파일로 저장 / 불러오기 (다른 컴퓨터로 옮길 수 있는 단일 파일) ----
function collectProjectData(){
  return {
    app:'geulwol', version:1,
    title: document.getElementById('docTitleInput').value,
    content: page.innerHTML,
    settings: settings
  };
}
function saveToFile(){
  const data = collectProjectData();
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const name = (document.getElementById('docTitleInput').value || settings.coverTitle || '제목 없는 문서').replace(/[\\/:*?"<>|]/g,'');
  a.download = name + '.gwol';
  a.click();
  showSaveStatus('파일로 저장됨');
}
function loadFromFile(file){
  const reader = new FileReader();
  reader.onload = e=>{
    let data;
    try{ data = JSON.parse(e.target.result); }
    catch(err){ alert('이 파일을 읽을 수 없습니다. 글월에서 저장한 .gwol 파일이 맞는지 확인해주세요.'); return; }
    if(typeof data.content === 'string') page.innerHTML = data.content;
    if(typeof data.title === 'string') document.getElementById('docTitleInput').value = data.title;
    if(data.settings){ settings = data.settings; applyPageBox(); }
    autosave();
    localStorage.setItem('geulwol_settings', JSON.stringify(settings));
    showSaveStatus('파일에서 불러옴');
  };
  reader.readAsText(file);
}
document.getElementById('btnSaveFile').addEventListener('click', saveToFile);
document.getElementById('btnLoadFile').addEventListener('click', ()=>document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', e=>{
  if(e.target.files[0]) loadFromFile(e.target.files[0]);
  e.target.value = '';
});

// ---- 페이지 자동 넘김 엔진 ----
const BLOCK=/^(P|H[1-6]|DIV|UL|OL|BLOCKQUOTE|PRE|TABLE|HR)$/;
const isBlock=n=>n.nodeType===1&&BLOCK.test(n.tagName);
const isSheet=n=>n.nodeType===1&&n.classList.contains('sheet');
function collectBlocks(){
  const out=[];
  const push=n=>{
    if(n.nodeType===3&&!n.textContent.trim()) return;
    if(n.nodeType!==1&&n.nodeType!==3) return;
    if(isBlock(n)) out.push(n);
    else{ const p=document.createElement('p'); n.parentNode.replaceChild(p,n); p.appendChild(n); out.push(p); }
  };
  Array.from(page.childNodes).forEach(n=>{ if(isSheet(n)) Array.from(n.childNodes).forEach(push); else push(n); });
  return out;
}
function rebuild(){
  const blocks=collectBlocks();
  page.innerHTML='';
  const s=document.createElement('div'); s.className='sheet'; page.appendChild(s);
  if(!blocks.length){ const p=document.createElement('p'); p.innerHTML='<br>'; blocks.push(p); }
  blocks.forEach(b=>s.appendChild(b));
}
function needRebuild(){
  if(!page.childNodes.length) return true;
  return Array.from(page.childNodes).some(n=>!isSheet(n)) || Array.from(page.children).some(s=>Array.from(s.childNodes).some(c=>!isBlock(c)&&!(c.nodeType===3&&!c.textContent.trim())));
}
function saveCaret(){
  const sel=getSelection();
  if(!sel.rangeCount||!sel.isCollapsed||!page.contains(sel.anchorNode)) return null;
  let b=sel.anchorNode;
  while(b&&b.parentNode&&b.parentNode!==page&&!isSheet(b.parentNode)) b=b.parentNode;
  if(!b||b.nodeType!==1||isSheet(b)) return null;
  const r=document.createRange(); r.selectNodeContents(b); r.setEnd(sel.anchorNode,sel.anchorOffset);
  return {b,off:r.toString().length};
}
function restoreCaret(c){
  if(!c||!c.b.isConnected) return;
  const w=document.createTreeWalker(c.b,NodeFilter.SHOW_TEXT), r=document.createRange();
  let n,left=c.off;
  while((n=w.nextNode())){ if(left<=n.length){ r.setStart(n,left); break; } left-=n.length; }
  if(!n) r.setStart(c.b, c.off? c.b.childNodes.length : 0);
  r.collapse(true);
  const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r);
  c.b.scrollIntoView({block:'nearest'});
}
function reflow(){
  const caret=saveCaret(); let moved=false;
  if(needRebuild()){ rebuild(); moved=true; }
  const sheets=Array.from(page.children);
  const limit=MM(settings.paperH-settings.mB);
  const top=el=>el.getBoundingClientRect().top;
  const mk=()=>{ const d=document.createElement('div'); d.className='sheet'; moved=true; return d; };
  const fits=(s,b)=>{
    const l=s.lastElementChild;
    const used=l? l.getBoundingClientRect().bottom-top(s)+parseFloat(getComputedStyle(l).marginBottom) : MM(settings.mT);
    return used+b.getBoundingClientRect().height+4<=limit;
  };
  for(let i=0;i<sheets.length;i++){
    const s=sheets[i];
    if(!s.firstElementChild){ s.remove(); sheets.splice(i--,1); moved=true; continue; }
    const ci=Array.from(s.children).findIndex((c,k)=>k>0&&c.matches('h1.chapter'));
    if(ci>0){ const nx=mk(); s.after(nx); sheets.splice(i+1,0,nx); Array.from(s.children).slice(ci).forEach(c=>nx.appendChild(c)); }
    const over=()=>s.children.length>1 && s.lastElementChild.getBoundingClientRect().bottom-top(s)>limit+.5;
    while(over()){
      let nx=sheets[i+1];
      if(!nx||(nx.firstElementChild&&nx.firstElementChild.matches('h1.chapter'))){ nx=mk(); s.after(nx); sheets.splice(i+1,0,nx); }
      nx.insertBefore(s.lastElementChild,nx.firstChild); moved=true;
    }
    const nx=sheets[i+1];
    while(nx&&nx.firstElementChild&&!nx.firstElementChild.matches('h1.chapter')&&fits(s,nx.firstElementChild)){ s.appendChild(nx.firstElementChild); moved=true; }
  }
  if(!page.children.length){ rebuild(); moved=true; sheets.push(page.firstElementChild); }
  sheets.forEach((s,k)=>{
    const n=settings.showPageNum?String(k+1):'', h=settings.headerText||'';
    if(s.dataset.n!==n) s.dataset.n=n;
    if(s.dataset.h!==h) s.dataset.h=h;
    const g=s.children.length===1 && s.lastElementChild.getBoundingClientRect().bottom-top(s)>limit+.5;
    if(s.classList.contains('grow')!==g) s.classList.toggle('grow',g);
  });
  if(moved) restoreCaret(caret);
}

function buildBook(){
  reflow();
  const pages=Array.from(page.querySelectorAll('.sheet')).map(s=>{
    const d=document.createElement('div'); Array.from(s.children).forEach(c=>d.appendChild(c.cloneNode(true))); return d;
  });
  const toc=[];
  pages.forEach((pg,i)=>{ const h=pg.querySelector('h1.chapter'); if(h) toc.push({title:h.textContent,page:i+1}); });
  return {pages,toc};
}

// ---- PNG / PDF 내보내기용: 화면 밖에 실제 페이지들을 렌더링 ----
function buildOffscreenPages(){
  const {pages, toc} = buildBook();
  const holder = document.createElement('div');
  holder.style.cssText = 'position:absolute;left:-99999px;top:0;'; setVars(holder);
  document.body.appendChild(holder);
  const pageEls = [];

  const cover = document.createElement('div'); cover.className='bookpage bp-cover';
  cover.style.width = MM(settings.paperW)+'px'; cover.style.height = MM(settings.paperH)+'px';
  cover.innerHTML = `<div style="font-size:28px;font-weight:700;font-family:'Noto Serif KR',serif">${settings.coverTitle||'제목 없는 책'}</div>
    ${settings.coverSubtitle?`<div style="font-size:15px;color:#666">${settings.coverSubtitle}</div>`:''}
    ${settings.coverAuthor?`<div style="font-size:14px;color:#888;margin-top:20px">${settings.coverAuthor}</div>`:''}`;
  holder.appendChild(cover); pageEls.push(cover);

  if(settings.showToc && toc.length){
    const tocPage = document.createElement('div'); tocPage.className='bookpage';
    tocPage.style.width = MM(settings.paperW)+'px'; tocPage.style.height = MM(settings.paperH)+'px';
    tocPage.style.padding = `${MM(settings.mT)}px ${MM(settings.mR)}px ${MM(settings.mB)}px ${MM(settings.mL)}px`;
    const list = toc.map(t=>`<li><span>${t.title}</span><span>${t.page}</span></li>`).join('');
    tocPage.innerHTML = `<h2 style="font-family:'Noto Serif KR',serif">목차</h2><ul class="bp-toc" style="list-style:none;padding:0">${list}</ul>`;
    holder.appendChild(tocPage); pageEls.push(tocPage);
  }

  pages.forEach((pgContent, i)=>{
    const bp = document.createElement('div'); bp.className='sheet'; bp.style.boxShadow='none';
    bp.dataset.h = settings.headerText||''; bp.dataset.n = settings.showPageNum? String(i+1):'';
    while(pgContent.firstChild) bp.appendChild(pgContent.firstChild);
    holder.appendChild(bp); pageEls.push(bp);
  });

  return {holder, pageEls};
}

function getExportTitle(){
  return document.getElementById('docTitleInput').value || settings.coverTitle || '제목 없는 책';
}

async function exportPNG(){
  const busy = document.getElementById('exportBusy'); busy.classList.add('show');
  try{
    const {holder, pageEls} = buildOffscreenPages();
    const canvases = [];
    for(const el of pageEls){
      canvases.push(await html2canvas(el, {scale:2, backgroundColor:'#ffffff'}));
    }
    document.body.removeChild(holder);
    const gap = 30;
    const width = Math.max(...canvases.map(c=>c.width));
    const totalHeight = canvases.reduce((s,c)=>s+c.height,0) + gap*(canvases.length-1) + gap*2;
    const combined = document.createElement('canvas');
    combined.width = width + gap*2; combined.height = totalHeight;
    const ctx = combined.getContext('2d');
    ctx.fillStyle = '#2b2b2b'; ctx.fillRect(0,0,combined.width,combined.height);
    let y = gap;
    canvases.forEach(c=>{ ctx.drawImage(c, gap + (width-c.width)/2, y); y += c.height + gap; });
    combined.toBlob(blob=>{
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = getExportTitle().replace(/[\\/:*?"<>|]/g,'') + '.png';
      a.click();
      busy.classList.remove('show');
    });
  }catch(e){ console.error(e); alert('PNG 저장 중 오류가 발생했습니다.'); busy.classList.remove('show'); }
}

async function exportPDF(){
  const busy = document.getElementById('exportBusy'); busy.classList.add('show');
  try{
    const {holder, pageEls} = buildOffscreenPages();
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:'mm', format:[settings.paperW, settings.paperH]});
    for(let i=0;i<pageEls.length;i++){
      const canvas = await html2canvas(pageEls[i], {scale:2, backgroundColor:'#ffffff'});
      const imgData = canvas.toDataURL('image/jpeg', 0.92);
      if(i>0) pdf.addPage([settings.paperW, settings.paperH]);
      pdf.addImage(imgData, 'JPEG', 0, 0, settings.paperW, settings.paperH);
    }
    document.body.removeChild(holder);
    pdf.save(getExportTitle().replace(/[\\/:*?"<>|]/g,'') + '.pdf');
  }catch(e){ console.error(e); alert('PDF 내보내기 중 오류가 발생했습니다.'); }
  busy.classList.remove('show');
}
document.getElementById('btnExportPNG').addEventListener('click', exportPNG);
document.getElementById('btnExportPDF').addEventListener('click', exportPDF);

// ---- export standalone HTML book ----
function exportBook(){
  const {pages, toc} = buildBook();
  const title = document.getElementById('docTitleInput').value || settings.coverTitle || '제목 없는 책';
  let body = '';
  body += `<section class="page cover"><div class="cover-title">${settings.coverTitle||title}</div>`;
  if(settings.coverSubtitle) body += `<div class="cover-sub">${settings.coverSubtitle}</div>`;
  if(settings.coverAuthor) body += `<div class="cover-author">${settings.coverAuthor}</div>`;
  body += `</section>`;
  if(settings.showToc && toc.length){
    body += `<section class="page toc"><h2>목차</h2><ul>`;
    toc.forEach(t=> body += `<li><span>${t.title}</span><span>${t.page}</span></li>`);
    body += `</ul></section>`;
  }
  pages.forEach((pg,i)=>{
    const hd=(settings.headerText||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    body += `<section class="page content" data-h="${hd}" data-n="${settings.showPageNum?(i+1):''}">${pg.innerHTML}</section>`;
  });

  const html = `<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${title}</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--w:${MM(settings.paperW)}px;--h:${MM(settings.paperH)}px;--mt:${MM(settings.mT)}px;--mb:${MM(settings.mB)}px;--ml:${MM(settings.mL)}px;--mr:${MM(settings.mR)}px;}
*{box-sizing:border-box}
body{margin:0;background:#3a3a3a;font-family:'Noto Serif KR',serif;display:flex;flex-direction:column;align-items:center;padding:30px 10px;gap:24px}
.page{width:var(--w);max-width:94vw;min-height:var(--h);background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.35);padding:var(--mt) var(--mr) var(--mb) var(--ml);display:flex;flex-direction:column}
.cover{align-items:center;justify-content:center;text-align:center;gap:12px}
.cover-title{font-size:30px;font-weight:700}
.cover-sub{font-size:16px;color:#666}
.cover-author{font-size:14px;color:#888;margin-top:24px}
.toc ul{list-style:none;padding:0}
.toc li{display:flex;justify-content:space-between;margin-bottom:8px;font-size:15px}
.content{position:relative;display:block;font-size:12pt;line-height:1.6}
.content::before{content:attr(data-h);position:absolute;top:calc(var(--mt)/2 - 8px);left:0;right:0;text-align:center;font:11px sans-serif;color:#999}
.content::after{content:attr(data-n);position:absolute;bottom:calc(var(--mb)/2 - 8px);left:var(--ml);right:var(--mr);text-align:${settings.pageNumPos==='right'?'right':'center'};font:11px sans-serif;color:#999}
.content h1.chapter{font-size:1.55em;font-weight:700;margin:0 0 .6em;padding-bottom:.4em;border-bottom:1px solid #d2d2d2}
.content p{margin:0 0 1em}
@media print{
  body{background:#fff;padding:0;gap:0}
  .page{box-shadow:none;page-break-after:always;max-width:none}
}
</style></head><body>${body}</body></html>`;

  const blob = new Blob([html], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (title.replace(/[\\/:*?"<>|]/g,'') || 'book') + '.html';
  a.click();
}
document.getElementById('btnExport').addEventListener('click', exportBook);

document.execCommand('defaultParagraphSeparator', false, 'p');
if(document.fonts){ document.fonts.ready.then(scheduleReflow); document.fonts.addEventListener('loadingdone', scheduleReflow); }
reflow();
